name: Build & Deploy Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gh-pages.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docs:
    if: ${{ github.repository == 'slaclab/slac-alarm-manager' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@9bd3f16145f87d30ed28c044c8e51121529840e0
    with:
      docs-group: "docs"
      docs-tool: "mkdocs"
