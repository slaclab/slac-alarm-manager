name: Build & Deploy Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gh-pages.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docs:
    if: ${{ github.repository == 'slaclab/slac-alarm-manager' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f
    with:
      docs-group: "docs"
      docs-tool: "mkdocs"
